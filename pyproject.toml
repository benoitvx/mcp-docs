[project]
name = "mcp-docs"
version = "0.1.0"
description = "MCP server exposing the Docs API (La Suite numérique) to AI agents"
requires-python = ">=3.12"
dependencies = [
    # Floors track the fix versions of known advisories, so a fresh resolve
    # from this file alone cannot land on a vulnerable release. mcp is capped
    # below 2.0 on purpose: 1.28.1 already clears every known advisory, so
    # validating a major-version jump does not belong in a security bump.
    "mcp>=2.3.0,<3",
    "httpx>=0.28.1",
    "tenacity>=9.2.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pycrdt>=0.14.8",
]

[project.scripts]
mcp-docs = "mcp_docs.server:main"
mcp-docs-refresh-session = "mcp_docs.session_refresh:main"

[project.optional-dependencies]
browser = ["playwright>=1.63.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "pyright>=1.1.414",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_docs"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
